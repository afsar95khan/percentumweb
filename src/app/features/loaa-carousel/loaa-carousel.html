<section class="finance">
  <header class="finance__head">
    <h2 class="finance__title">Velg finansiering som passer deg</h2>

    <div class="toggle" role="tablist" aria-label="Kundetype">
      <button
        type="button"
        role="tab"
        class="toggle__btn"
        [class.is-active]="tab() === 'privat'"
        [attr.aria-selected]="tab() === 'privat'"
        (click)="setTab('privat')"
      >
        Privat
      </button>
      <button
        type="button"
        role="tab"
        class="toggle__btn"
        [class.is-active]="tab() === 'bedrift'"
        [attr.aria-selected]="tab() === 'bedrift'"
        (click)="setTab('bedrift')"
      >
        Bedrift
      </button>
    </div>
  </header>

  <div class="finance__stage">
    <button type="button" class="nav-btn" aria-label="Forrige" (click)="prev()">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>

    <div class="swiper" #swiperHost>
      <div class="swiper-wrapper">
        @for (card of slides(); track $index) {
          <div class="swiper-slide">
            <article class="card">
              <div class="card__icon" aria-hidden="true">
                @switch (card.icon) {
                  @case ('house') {
                    <svg viewBox="0 0 48 48" width="36" height="36" fill="#f00">
                      <path d="M24 5 3 22h5v19h32V22h5L24 5Zm0 11a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm-3 24V28h6v12h-6Z"/>
                    </svg>
                  }
                  @case ('card') {
                    <svg viewBox="0 0 48 48" width="36" height="36" fill="#f00">
                      <rect x="6" y="11" width="36" height="26" rx="5"/>
                      <rect x="10" y="17" width="28" height="4" fill="#fff"/>
                      <rect x="11" y="27" width="10" height="5" rx="1" fill="#fff"/>
                    </svg>
                  }
                  @case ('chart') {
                    <svg viewBox="0 0 48 48" width="36" height="36" fill="none" stroke="#f00"
                         stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 14v14M20 10v18M28 16v12M36 12v16"/>
                      <path d="M8 38l9-8 7 5 9-9 7 4" stroke-width="3"/>
                    </svg>
                  }
                  @case ('briefcase') {
                    <svg viewBox="0 0 48 48" width="36" height="36" fill="#f00">
                      <path d="M17 12a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v3h-4v-1h-6v1h-4v-3Z"/>
                      <rect x="6" y="15" width="36" height="24" rx="4"/>
                      <rect x="6" y="25" width="36" height="3" fill="#fff"/>
                      <rect x="21" y="23" width="6" height="7" rx="1" fill="#fff"/>
                    </svg>
                  }
                  @case ('building') {
                    <svg viewBox="0 0 48 48" width="36" height="36" fill="#f00">
                      <path d="M12 6h18v32H12z"/><path d="M30 18h8v20h-8z"/>
                      <path d="M6 40h36v3H6z"/>
                      <g fill="#fff">
                        <rect x="16" y="11" width="3" height="3"/><rect x="23" y="11" width="3" height="3"/>
                        <rect x="16" y="18" width="3" height="3"/><rect x="23" y="18" width="3" height="3"/>
                        <rect x="16" y="25" width="3" height="3"/><rect x="23" y="25" width="3" height="3"/>
                        <rect x="33" y="23" width="2.5" height="3"/><rect x="33" y="30" width="2.5" height="3"/>
                      </g>
                    </svg>
                  }
                  @case ('project') {
                    <svg viewBox="0 0 48 48" width="36" height="36" fill="none" stroke="#f00"
                         stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M8 40V14l16-6 16 6v26"/><path d="M4 40h40"/>
                      <path d="M18 40V26h12v14"/>
                    </svg>
                  }
                }
              </div>

              <h3 class="card__title">{{ card.title }}</h3>
              <p class="card__text">{{ card.text }}</p>

              <a href="#" class="card__cta">
                Søk nå
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.6"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </a>
            </article>
          </div>
        }
      </div>
    </div>

    <button type="button" class="nav-btn" aria-label="Neste" (click)="next()">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</section>
