<section class="investment-view" aria-labelledby="investments-title">
  <header class="section-heading">
    <div>
      <h2 id="investments-title">Mine investeringer</h2>
      <p>Oversikt over lånene du har investert i.</p>
    </div>
  </header>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th scope="col">Prosjekt</th>
          <th scope="col">Lånebeløp</th>
          <th scope="col">Tegningsbeløp</th>
          <th scope="col">Rente (avkastning)</th>
          <th scope="col">Avkastning i NOK</th>
          <th scope="col">Innbetalt beløp</th>
          <th scope="col">Løpetid (mnd)</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="8">
            <div class="empty-state">
              <span class="empty-icon pi pi-inbox" aria-hidden="true"></span>
              <strong>Ingen investeringer å vise ennå</strong>
              <span>Investeringene dine vises her når du deltar i et prosjekt.</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
