<main class="dashboard-page">
  <section class="dashboard-content" aria-labelledby="welcome-title">
    <p class="eyebrow">MIN SIDE</p>
    <h1 id="welcome-title">Velkommen{{ user()?.firstName ? ', ' + user()?.firstName : '' }}</h1>
    <!-- <p class="welcome-description">Hva ønsker du å gjøre i dag?</p> -->
    <div class="dashboard-grid">
      @for (item of items; track item.label) {
        <a class="dashboard-tile" [routerLink]="item.route">
          <span class="tile-icon"><i [class]="item.icon" aria-hidden="true"></i></span>
          <span class="tile-copy">
            <h2>{{ item.label }}</h2>
            <span>{{ item.description }}</span>
          </span>
          <i class="tile-arrow pi pi-arrow-right" aria-hidden="true"></i>
        </a>
      }
    </div>
  </section>
</main>
