    <div>

    </div>
  </header>

  <div class="table-scroll">
    <table>

        <tr>
          <th scope="col">Dato</th>
          <th scope="col">Type</th>
          <th scope="col">Beskrivelse</th>

          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <span class="empty-icon pi pi-sync" aria-hidden="true"></span>

            </div>

        </tr>
      </tbody>
    </table>
  </div>
